# Builds the app and ships it to the internal testers:
# iOS -> TestFlight (Scout Internal Beta), Android -> Google Play internal testing.
# Started on every push to main by .github/workflows/eas-release.yml (GitHub Actions),
# or by hand with: eas workflow:run .eas/workflows/release-internal.yml
name: Release to internal testers

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit to Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
